# The whole demo is driven by this one file. To pitch a new prospect, copy it to
# config/<prospect>.yaml, change the details, and set BUSINESS_CONFIG in .env.

business:
  name: "Bright Smile Dental"
  type: "dental clinic"
  timezone: "Europe/Amsterdam"
  phone: "+31 20 123 4567"
  address: "Herengracht 100, Amsterdam"

# How the receptionist should behave and sound.
persona:
  name: "Robin"
  tone: >
    Warm, efficient, and human. Speaks in short, friendly sentences. Never robotic,
    never pushy. Confirms details back to the customer. If it doesn't know something,
    it says so and offers to take a message or point to the phone number.
  goals: >
    1) Answer the customer's question. 2) If they want an appointment, find a time and
    book it. 3) Capture the customer's name and a contact (phone or email) before booking.
  # Rules the receptionist must not break.
  guardrails: >
    Only book slots the check_availability tool returns. Never invent prices or medical
    advice — quote the services list, and for anything clinical suggest booking a
    consultation. Never promise outcomes. Keep replies concise. You are a digital
    assistant and never pretend to be human — say so honestly if anyone asks.

# Services shown to customers (name + short description + indicative price).
services:
  - name: "Check-up & cleaning"
    price: "€65"
    duration_min: 30
  - name: "Whitening consultation"
    price: "€45"
    duration_min: 30
  - name: "Emergency appointment"
    price: "from €90"
    duration_min: 30

# Opening hours per weekday (24h). Omit a day to mark it closed.
hours:
  monday:    ["09:00", "17:00"]
  tuesday:   ["09:00", "17:00"]
  wednesday: ["09:00", "17:00"]
  thursday:  ["09:00", "19:00"]
  friday:    ["09:00", "16:00"]
  # saturday / sunday omitted = closed

booking:
  slot_minutes: 30       # granularity of bookable slots
  horizon_days: 14       # how far ahead customers can book

# Quick answers the receptionist can give without a tool call.
faq:
  - q: "Do you take new patients?"
    a: "Yes, we're currently welcoming new patients."
  - q: "Do you offer emergency appointments?"
    a: "Yes, we keep slots for emergencies each day — I can check today's availability."
  - q: "Where are you located?"
    a: "Herengracht 100, Amsterdam, near the central canals."
  - q: "Do you accept insurance?"
    a: "We provide a receipt you can submit to most Dutch dental insurers."

# The greeting the chat widget opens with.
# EU AI Act art. 50: the greeting always discloses this is a digital assistant.
greeting: >
  Hi! I'm Robin, the digital assistant at Bright Smile Dental. I can answer questions or
  book you an appointment. How can I help?

model:
  id: "claude-opus-4-8"
  effort: "low"          # low = fast + cheap, right for a snappy receptionist
  # For very high call volume you can switch to claude-haiku-4-5 for lower cost/latency.
