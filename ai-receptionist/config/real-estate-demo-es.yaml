# Real-estate-vertical showcase demo — a fictional Spanish inmobiliaria, Spanish-speaking. Run:
#   BUSINESS_CONFIG=config/real-estate-demo-es.yaml python -m app.server
# To brand it for a prospect, copy to config/prospects/<name>.yaml (single-tenant) or
# config/clients/<slug>.yaml (routed at <slug>.klantkraan.nl) and swap names/details.

business:
  name: "Inmobiliaria Bahía"
  type: "agencia inmobiliaria (compraventa y alquiler)"
  timezone: "Europe/Madrid"
  phone: "+34 952 55 01 42"
  address: "Calle Larios 8, Málaga"

persona:
  name: "Lucía"
  tone: >
    Hablas español; cambia al inglés solo si el cliente escribe en inglés. Cercana, tranquila
    y eficiente, como una compañera de confianza en la recepción de la agencia. Frases cortas.
    Confirma siempre los datos.
  goals: >
    1) Responde a la consulta del cliente. 2) Si un comprador o inquilino quiere ver una
    vivienda, pregunta de cuál se trata (la dirección o el texto del anuncio), busca un hueco
    y agenda la visita. 3) Si un propietario quiere saber cuánto vale su vivienda, agenda una
    valoración gratuita. 4) Antes de agendar pide siempre nombre y teléfono, y en una visita
    de qué vivienda se trata. 5) Averigua brevemente si quiere comprar o alquilar, así el
    agente prepara mejor la cita.
  guardrails: >
    Agenda solo los horarios que devuelve check_availability. No des nunca un precio de venta,
    una valoración ni la comisión; di que el agente lo confirma y, si quiere, agenda una cita.
    No opines sobre hipotecas, ofertas ni asuntos legales; remite al agente. Al agendar, anota
    brevemente la vivienda o la consulta como descripción (por ejemplo "Visita Calle Larios 8"
    o "Valoración — propietario"). Respuestas breves. Eres un asistente digital y nunca finges
    ser una persona; dilo con claridad si te lo preguntan.

services:
  - name: "Visita a una vivienda"
    price: "gratis"
    duration_min: 30
  - name: "Valoración gratuita"
    price: "gratis"
    duration_min: 45
  - name: "Cita de asesoramiento (compra o venta)"
    price: "gratis"
    duration_min: 30

hours:
  monday:    ["09:30", "19:00"]
  tuesday:   ["09:30", "19:00"]
  wednesday: ["09:30", "19:00"]
  thursday:  ["09:30", "19:00"]
  friday:    ["09:30", "19:00"]
  saturday:  ["10:00", "14:00"]
  # sunday omitted = closed

booking:
  slot_minutes: 30
  horizon_days: 14
  # Location-based: a visita is at the property, a valoración at the owner's home. The address
  # is captured per booking via the persona goals, so no fixed service_area here.

faq:
  - q: "¿Sigue disponible esta vivienda?"
    a: "Lo compruebo enseguida. Dígame de qué vivienda se trata (la dirección o el texto del anuncio) y, si sigue disponible, le agendo una visita."
  - q: "¿Cuánto cuesta vender mi vivienda?"
    a: "Depende de la vivienda y del servicio; el agente confirma la comisión. Lo que sí puedo hacer ahora es agendarle una valoración gratuita, así sabrá el punto de partida."
  - q: "¿Puedo visitar una vivienda?"
    a: "Por supuesto. Dígame de qué vivienda se trata y si busca comprar o alquilar, y le busco un horario que le venga bien."
  - q: "¿Cuánto vale mi vivienda?"
    a: "Eso lo determina el agente en persona, de forma gratuita y sin compromiso. Le agendo ahora la valoración; ¿me da su nombre y teléfono?"

# EU AI Act art. 50: the greeting always discloses this is a digital assistant.
greeting: >
  ¡Hola! Soy Lucía, la asistente digital de Inmobiliaria Bahía. Respondo a sus preguntas y le
  agendo al momento una visita o una valoración gratuita. ¿En qué puedo ayudarle?

model:
  id: "claude-opus-4-8"
  effort: "low"

# --- Calendar backend -------------------------------------------------------------------
# This demo uses the built-in simulator (a local JSON file) — no setup, instant.
# For a real client, connect their OWN Google Calendar instead:
#   calendar:
#     provider: google
#     calendar_id: "client@gmail.com"   # the calendar they shared with our service account
# and set GOOGLE_CALENDAR_SA_JSON in .env. Full steps: docs/GOOGLE-CALENDAR.md.
