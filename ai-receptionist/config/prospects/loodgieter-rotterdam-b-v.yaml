# Demo config for Loodgieter Rotterdam B.V.. Tweak services/hours/FAQ to match
# their real business (pull from their website / Google profile), then run:
#   BUSINESS_CONFIG=config/prospects/loodgieter-rotterdam-b-v.yaml python -m app.server

business:
  name: Loodgieter Rotterdam B.V.
  type: loodgietersbedrijf
  timezone: Europe/Amsterdam
  phone: +31 6 26144204
  address: Rotterdam en omgeving
persona:
  name: Fleur
  tone: Je spreekt Nederlands; schakel alleen naar Engels als de klant in het Engels schrijft. Vriendelijk,
    rustig en snel — als een behulpzame collega aan de balie. Korte zinnen. Geruststellend bij spoed (een
    lekkage, geen verwarming). Bevestig details altijd terug.
  goals: 1) Beantwoord de vraag van de klant. 2) Wil de klant een afspraak, zoek dan een tijd en plan
    die in. 3) Vraag vóór het boeken om naam, telefoonnummer en een korte omschrijving van het probleem.
    4) Behandel grote lekkages of geen verwarming in de winter als spoed en bied het eerstvolgende slot
    aan.
  guardrails: 'Boek alleen tijden die check_availability teruggeeft. Noem geen exacte reparatieprijzen
    buiten de dienstenlijst — noem het starttarief en zeg dat de monteur het op locatie bevestigt. Geef
    nooit doe-het-zelfadvies voor gas- of elektrawerk; adviseer een afspraak of bellen. Zet bij het boeken
    een korte omschrijving van de klus als service (bijv. ''Spoed: geen warm water''). Houd antwoorden
    kort. Je bent een digitale assistent en doet je nooit voor als mens.'
services:
- name: Spoedservice (lekkage / storing)
  price: vanaf €90
  duration_min: 60
- name: Cv-ketel onderhoud
  price: €120
  duration_min: 60
- name: Reparatie / lekkage-afspraak
  price: vanaf €75
  duration_min: 60
- name: Offerte / inspectie
  price: gratis
  duration_min: 30
hours:
  monday:
  - 08:00
  - '18:00'
  tuesday:
  - 08:00
  - '18:00'
  wednesday:
  - 08:00
  - '18:00'
  thursday:
  - 08:00
  - '18:00'
  friday:
  - 08:00
  - '18:00'
  saturday:
  - 09:00
  - '13:00'
booking:
  slot_minutes: 60
  horizon_days: 14
faq:
- q: Doen jullie spoedklussen?
  a: Ja — we houden elke dag spoedslots vrij. Ik kan direct de eerstvolgende tijd voor u nakijken.
- q: Rekenen jullie voorrijkosten?
  a: Spoedservice vanaf €90; offertes en inspecties zijn gratis.
- q: In welke regio werken jullie?
  a: We werken in de regio en omgeving.
- q: Hoe snel kan er iemand komen?
  a: Dat hangt van de dag af — ik kan nu de beschikbaarheid voor u nakijken.
greeting: Goedendag! Ik ben Fleur, de digitale receptionist van Loodgieter Rotterdam B.V.. Ik beantwoord
  uw vragen en plan direct een afspraak in — ook bij spoed. Waarmee kan ik u helpen?
model:
  id: claude-opus-4-8
  effort: low
