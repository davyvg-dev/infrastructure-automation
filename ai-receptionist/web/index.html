<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Receptionist</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2430; --muted: #6b7683;
      --bot: #eef1f5; --me: #2f6df6; --me-ink: #ffffff; --line: #e4e8ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216; --panel: #171b21; --ink: #e8ecf1; --muted: #9aa5b1;
        --bot: #222831; --me: #2f6df6; --me-ink: #ffffff; --line: #2a3038;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: 100%; max-width: 440px; height: min(680px, 92vh);
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }
    header {
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #35c46a; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header span { color: var(--muted); font-size: 12px; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
    .me  { background: var(--me); color: var(--me-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
    .typing { color: var(--muted); font-style: italic; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    input {
      flex: 1; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg); color: var(--ink); font-size: 15px;
    }
    button {
      padding: 0 16px; border: 0; border-radius: 10px; background: var(--me);
      color: #fff; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <span class="dot"></span>
      <div>
        <h1 id="biz">Assistant</h1>
        <span>AI receptionist · replies instantly</span>
      </div>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message…" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    let sessionId = null;

    function bubble(text, cls) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function init() {
      try {
        const cfg = await (await fetch('/config')).json();
        document.getElementById('biz').textContent = cfg.name;
        document.title = cfg.name;
        bubble(cfg.greeting, 'bot');
      } catch {
        bubble('Hi! How can I help?', 'bot');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      bubble(text, 'me');
      input.value = '';
      input.focus();
      send.disabled = true;
      const typing = bubble('…', 'bot typing');
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        const data = await res.json();
        sessionId = data.session_id;
        typing.remove();
        bubble(data.reply, 'bot');
      } catch {
        typing.remove();
        bubble('Sorry, something went wrong. Please try again.', 'bot');
      } finally {
        send.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
