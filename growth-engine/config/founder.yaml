# The knob-board for the FOUNDER voice — the personal thought-leadership track
# (see klantkraan/docs/01-strategy/: the "compounding stack"). Not a product vertical:
# this drafts the founder's own posts — build logs, teardowns, compliance takes —
# for his personal LinkedIn. Run with: GROWTH_CONFIG=config/founder.yaml
#
# Needs its own .env.founder with its OWN Telegram bot token (one poller per token).
# LinkedIn is assisted-only (ToS): drafts arrive in Telegram, the founder pastes.

vertical: founder

brand:
  name: "Klantkraan"                 # the company the founder is building, named naturally
  website: "klantkraan.nl"
  offer: "AI receptionists for Dutch trade businesses — and underneath them, the operations
    layer that runs a trade's whole customer workflow: intake, quote follow-up, scheduling,
    invoicing, reviews."
  one_liner: "I run Dutch trades' whole customer workflow with AI — from first message to
    paid invoice — and I'm building it in public."
  audience: "AI engineers and vertical-SaaS founders building applied agents, plus operators
    and Dutch SMB owners who follow the build. They value shipped work, real numbers, and
    honest failure notes; they smell marketing instantly."
  proof_mode: "build_in_public"

voice:
  tone: "A builder narrating his own work on the record. Direct, specific, quietly
    opinionated. Technical when it earns its place, always in plain words. Short sentences.
    Confident without bravado; failures reported as plainly as wins."
  avoid: "Thought-leader clichés ('excited to announce', 'humbled', 'journey'), humblebrags,
    engagement-bait, hype about AI replacing everyone, corporate buzzwords, hashtag walls,
    'game-changer', 'unlock', 'in this thread I'll'."
  # Injected verbatim into the system prompt under "Rules that matter" — the
  # per-track part of the voice (who the reader is, what to lead with).
  audience_rules: |-
    - Write for PEERS AND OPERATORS — people building applied AI or running real businesses —
      on the founder's personal channel. The build is the story; the company gets named when
      it fits, never pitched.
    - Leading with the tech is fine here: an architecture choice, an eval result, an agent
      pattern, an EU AI Act decision. But every post lands on what it changed for a real
      trade business — a booked job, a chased quote, a saved hour.
    - Narrate decisions and trade-offs honestly, including what failed and what it cost.
      Credibility is the product of this channel; one inflated claim spends all of it.

languages:
  primary: "English"      # the applied-AI crowd is international
  secondary: "Dutch"
  rule: "write the variants in English — the applied-AI and operator audience is
    international. A post whose subject is squarely Dutch (a Dutch client story, a
    Dutch-market or EU-regulation take aimed at Dutch owners) may be in Dutch instead"

# Pillars mirror the weekly operating system: ~50% of the founder's week is building,
# so the build log dominates; the rest turns that same work into authority.
pillars:
  - key: build_log
    weight: 4
    brief: "What actually shipped in Klantkraan this week — one decision, bug, number, or
      small win, told from the inside. 'The bot misheard 15 as 50 on 1 in 40 messages until
      I added a confirm step' is the register. Pairs with the /buildlog command; tie it to
      what the change does for a real trade business."
  - key: teardown
    weight: 2
    brief: "Take one applied-AI or vertical-SaaS idea apart with evidence from the build:
      why the receptionist is a wedge and the workflow is the moat, what a production agent
      pattern really costs, where a hyped approach fell over in practice. Defensible,
      specific, sourced from work actually done."
  - key: workflow_story
    weight: 2
    brief: "Show one stage of a trade's customer workflow being run by AI, end to end:
      intake triage, quote follow-up chasing, review requests, invoicing. Concrete scenario,
      real mechanics, what the owner no longer has to do. This is the flagship material —
      'how we run a Dutch roofer's whole customer workflow' in weekly slices."
  - key: compliance_take
    weight: 2
    brief: "EU AI Act and AI governance from a practitioner who ships under it: what art. 50
      disclosure looks like in a real greeting, what AIGP study surfaced, why honest
      disclosure converts better than 'they can't tell it's AI'. Practical, never
      scaremongering or legal-advice-flavored."
  - key: frontier_note
    weight: 1
    brief: "One takeaway from the week's frontier reading (Latent Space, Raschka, Lambert,
      Willison) that was actually tried inside Klantkraan — what held up, what didn't.
      Reading reported without application doesn't qualify."

# LinkedIn only, assisted (ToS forbids automation — drafts arrive in Telegram to paste).
# X stays off until the founder has a personal X account + creds; flip enabled then.
platforms:
  x:
    enabled: false
    delivery: auto
    label: "𝕏 (auto-post)"
    char_limit: 280
    media: none
    media_required: false
    note: "Off: the Klantkraan X account belongs to the product track. Personal X later."
    writing: "X post: max 280 characters, punchy, personality-forward, no hashtags unless
      natural. A strong first line that stands alone."
  linkedin:
    enabled: true
    delivery: assisted
    label: "in LinkedIn (paste)"
    media: none
    media_required: false
    note: "The founder's primary stage — buyers and peers both live here. No links in the
      post body (comment 1 / Featured)."
    writing: "LinkedIn post (the founder's primary stage): 150-400 words. The first 1-3
      lines are a scroll-stopping hook that stands alone above the fold — the concrete
      moment, not a setup. Generous line breaks (1-2 sentences each), one idea, end with a
      genuine question or a plain closing thought — never a formulaic CTA. NO links in the
      body. No hashtag walls."

# Text-first channel: no branded cards — a founder post with a company-branded image
# reads as an ad. Screenshots/clips get attached by hand when a post needs one.
media:
  cards: false

cadence:
  # One draft a day to approve or skip keeps the roadmap's "one artifact per week"
  # floor with room to spare; skipping in Telegram costs one tap.
  active: starter
  profiles:
    starter:
      runs_per_day: 1
      drafts_per_run: 1
      platforms_per_draft: ["linkedin"]
    growth:
      runs_per_day: 1
      drafts_per_run: 2
      platforms_per_draft: ["linkedin"]
  quiet_hours_start: 22
  quiet_hours_end: 8
  timezone: "Europe/Amsterdam"

# The founder track leans hardest on /buildlog: commits are the raw material.
buildlog:
  enabled: true
  repo_path: ".."
  max_commits: 25

model:
  id: "claude-opus-4-8"
  effort: "medium"
