# The single knob-board for the engine. Edit this, not the code.
# One engine process per vertical: this file is the trades vertical (the default);
# another vertical = another YAML selected via GROWTH_CONFIG (e.g. config/fitness.yaml).

vertical: trades

brand:
  name: "Klantkraan"                 # the business; posts go out from the founder's accounts
  website: "klantkraan.nl"
  offer: "AI receptionists for Dutch trade businesses — an assistant that answers every
    call and WhatsApp instantly 24/7, qualifies the customer, and books the job into the
    calendar."
  one_liner: "Je bedrijf krijgt een AI die elke klant direct antwoordt, 24/7, en de
    afspraak meteen inplant — zodat je geen klussen meer verliest aan gemiste telefoontjes."
  # Niche is DECIDED: Dutch trades (see klantkraan/research/). Don't broaden until it works.
  audience: "Owners of Dutch trade businesses — installateurs, loodgieters, elektriciens,
    schilders. They lose real money to missed calls and slow replies: an unanswered
    after-hours call is usually a job that walks to a competitor. They are vakmensen and
    business owners, not tech people."
  # 'build-in-public': you have no past client work yet, so content is shipped live.
  proof_mode: "build_in_public"

voice:
  # How the drafts should sound. Keep it concrete and human.
  tone: "Direct, concrete, a little opinionated. Builder-to-builder honesty. No hype,
    no emoji spam, no 'in today's fast-paced world' filler. Short sentences."
  avoid: "Corporate buzzwords, engagement-bait questions with no substance, hashtag walls,
    fake urgency, 'game-changer', 'unlock', 'in this thread I'll'."

languages:
  primary: "Dutch"        # the buyer's language — customer-facing posts are Dutch
  secondary: "English"    # allowed for build-log posts aimed at the builder crowd

# Content pillars, weighted toward the BUYER (a business owner), not other builders. The
# mix is ~40% proof, 30% problem, 20% teardown/hot-take, 10% build log — proof + problem
# convert; a dev-facing build/teardown/hot-take rotation grows the wrong audience.
pillars:
  - key: proof_demo
    weight: 4
    brief: "Show the receptionist actually working — a booking made, a call answered, a
      reschedule handled, an uptime/latency number, 'it booked an appointment while I slept'.
      Lead with the concrete result. Written to pair with a screenshot, call recording, or
      short clip the user attaches."
  - key: problem
    weight: 3
    brief: "Speak to the buyer's pain in money terms. Quantify what missed calls / slow
      replies cost a specific local business type (e.g. 'a plumber who misses 12 calls a week
      is leaking ~EUR X/month'), or a sharp before/after. End with a light, non-pushy
      takeaway. This is the highest-converting angle: educate the problem, don't hard-sell."
  - key: teardown
    weight: 2
    brief: "Tear down a bad customer experience the buyer's own clients hit — a call that
      rang out, a booking form nobody answers — and show how it should work. OR plainly
      explain how an AI receptionist actually works. Buyer-relevant, never developer bait."
  - key: hot_take
    weight: 2
    brief: "A sharp, industry-facing opinion aimed at business owners (e.g. 'phone trees are
      dead', 'your front desk shouldn't cost EUR 3k/month to still miss calls'). Defensible
      and useful, not an AI/tech debate."
  - key: build_log
    weight: 1
    brief: "An honest behind-the-scenes note on building the receptionist — a decision, a
      bug, a small win — but tie it back to the customer benefit so it lands with buyers,
      not just other builders."

# The platform registry (read by src/platforms.py) — everything per-platform lives HERE.
# LinkedIn is your HOME platform (B2B buyers live there); X is DISTRIBUTION + personality.
# The engine drafts native variants for each — never the same string on both.
# Per platform: enabled, delivery (auto|assisted), label (shown in Telegram), char_limit
# (optional), media (none|image|video|both), media_required, writing (drafting guidance).
platforms:
  x:
    enabled: true
    delivery: auto          # auto-post via API on approval
    label: "𝕏 (auto-post)"
    char_limit: 280
    media: none
    media_required: false
    note: "Distribution/personality. Links OK in-body. Punchier than LinkedIn."
    writing: "X post: max 280 characters, punchy, personality-forward, no hashtags unless
      natural. A strong first line that stands alone."
  linkedin:
    enabled: true
    delivery: assisted      # formatted + pushed to you to paste (native posts perform best)
    label: "in LinkedIn (paste)"
    media: none
    media_required: false
    note: "Primary B2B channel. No links in the post body (put them in comment 1 / Featured)."
    writing: "LinkedIn post (primary B2B channel): 150-400 words. The first 1-3 lines are
      a scroll-stopping hook that stands alone above the fold. Generous line breaks (1-2
      sentences each), one idea, end with a genuine question to spark comments. NO links
      in the body. No hashtag walls."
  reddit:
    enabled: true
    delivery: assisted
    label: "🔶 Reddit (paste)"
    media: none
    media_required: false
    note: "Value-first only. 1-2 high-effort posts/week, posted manually."
    writing: "Reddit: value-first, zero self-promotion in the body. Written to genuinely
      help in a relevant subreddit (e.g. r/smallbusiness, r/Klussers, r/ondernemers).
      Sound like a helpful practitioner, not an ad."
  # Meta/TikTok ToS forbid auto-posting — these three are assisted-only, permanently.
  facebook:
    enabled: true
    delivery: assisted
    label: "📘 Facebook (paste)"
    media: image
    media_required: false
    note: "Local-business reach (trades owners are on FB). Image cards lift it, text works."
    writing: "Facebook post: conversational local-business tone, 50-150 words. Open with
      the customer's pain in plain words, close with one clear next step. No hashtag
      walls, at most one link."
  instagram:
    enabled: true
    delivery: assisted
    label: "📸 Instagram (paste)"
    media: both
    media_required: true
    note: "Fitness-vertical home turf. Needs an image or reel — caption alone can't post."
    writing: "Instagram caption: the first line is the hook (shown before 'more'). Short
      lines, concrete benefit, end with a simple CTA. 3-5 relevant hashtags at the end,
      no more."
  tiktok:
    enabled: true
    delivery: assisted
    label: "🎵 TikTok (paste)"
    media: video
    media_required: true
    note: "Reels-only channel for the fitness vertical. The caption rides along the video."
    writing: "TikTok caption: one punchy line that frames the video's payoff, under 150
      characters, plus 2-3 niche hashtags. No sales speak."

# Generated media: each draft gets a branded image card (square + story) rendered from
# its sharpest claim, previewed in Telegram. Colors/fonts per docs/09-brand (klantkraan).
media:
  cards: true
  brand:
    bg: "#0F4C81"        # kraan-blue
    text: "#FAF6EE"      # kraan-cream
    accent: "#C75A2B"    # kraan-rust
    muted: "#4D80AD"     # kraan-blue-300
    footer: "klantkraan.nl"
    font_bold: "assets/fonts/Inter-Bold.ttf"
    font_regular: "assets/fonts/Inter-Regular.ttf"
    # Rotated per draft (deterministic) so the feed isn't one repeated template.
    schemes:
      - { bg: "#0F4C81", text: "#FAF6EE", muted: "#4D80AD" }   # blue
      - { bg: "#FAF6EE", text: "#0F4C81", muted: "#8C8474" }   # cream
      - { bg: "#F1ECDF", text: "#1A1A1A", muted: "#8C8474" }   # stone
  # Every Nth card becomes a stock photo (Pexels, dark scrim + text) when the draft has
  # a photo_query and PEXELS_API_KEY is set. Pexels: free commercial use, no attribution.
  stock:
    enabled: true
    every: 1           # every card is a photo card (founder preference 2026-07-14)
    theme: "plumber"    # appended to every photo search to keep results in-industry
  # Reels: a raw screen recording (uploaded via the bot's 🎬 button) becomes a branded
  # 9:16 video — status bar cropped, dead time pop-cut away, brand stage, Pillow
  # title/end cards. Only attached to drafts that target a video platform.
  reel:
    enabled: true
    crop_top: 0.055     # fraction of source height to crop (iOS status bar) — tune
                        # once after the first reel; device-specific
    crop_bottom: 0.0
    # Short-form: typing stays visible but fast; AI replies land instantly (the wait
    # is cut, not sped up); each message holds just long enough to read.
    pop_cuts: true
    scene_threshold: 0.08     # CEILING for "a message appeared" — the working
                              # threshold adapts per clip (6% of its biggest change)
    typing_threshold: 0.0006  # keystroke floor, measured in the keyboard band
    keys_band: 0.45           # bottom fraction of the frame where typing happens;
                              # changes above it (typing indicator) are cut, not ticked
    typing_speed: 3.0         # typing playback speed
    dwell_seconds: 1.8        # max hold per message; shrinks to fit the cap
    target_seconds: 15      # hard cap for the finished reel
    max_speed: 4.0
    cold_open: true         # open on the payoff message, then replay the chat
    suspense_seconds: 0.6   # one "..." beat of real waiting before the payoff
    hook_seconds: 3.0       # hook text rides the opening footage — no title card
    cta_seconds: 1.0        # CTA rides a freeze of the last frame — no end card
    cta_headline: "Zien hoe het werkt?"   # end card (Dutch, buyer-facing)
    cta_sub: "klantkraan.nl"
    # Baked-in sound design: synthesized SFX from assets/sfx (pop per message, ticks
    # while typing, ding on the payoff). NEVER commercial music — trending audio is
    # added in-app when posting (copyright; see docs/REELS.md).
    audio:
      enabled: true
      sfx: true
      bed: ""             # optional licensed/CC0 ambient file (path); empty = no bed
      bed_gain_db: -24    # bed level under the SFX
    # Scripted chat-demo reels: drawn frame-by-frame from a scenario below, so every
    # video draft ships with a reel automatically — sound perfectly synced by
    # construction. The 🎬 upload replaces it with real footage when preferred.
    # Fictional business, digital-assistant disclosure in the chat header.
    demo:
      enabled: true
      business: "Jansen Installatie"
      # On screen from the start — the widget's own greeting, with the disclosure.
      greeting: "Goedemiddag! U chat met de digitale assistent van Jansen Installatie. Waarmee kan ik helpen?"
      scenarios:
        - - { from: klant, text: "Hoi, mijn cv-ketel valt steeds uit. Kunnen jullie komen?" }
          - { from: ai, text: "Vervelend! Ik plan direct een monteur voor u in. Wanneer komt het uit?" }
          - { from: klant, text: "Morgen om 10:00?" }
          - { from: ai, text: "Ingepland: morgen 10:00. U ontvangt zo een bevestiging. Tot morgen!" }
        - - { from: klant, text: "Bel net, geen gehoor. Lekkage onder de gootsteen!" }
          - { from: ai, text: "Ik help u meteen — een spoedafspraak kan vandaag nog." }
          - { from: klant, text: "Kan iemand vanmiddag komen?" }
          - { from: ai, text: "Spoedafspraak staat: vandaag 15:30. De monteur belt als hij onderweg is." }

# Cadence: how many generation runs per day and how many drafts each run makes.
# Start conservative; raise once you trust the quality.
# NOTE: the engine drafts ORIGINAL posts only. The real growth lever — replies/comments
# (5-10/day on LinkedIn, 20-40/day on X) and DMs — must stay HUMAN; automating them kills
# reach and trust. See docs/STRATEGY.md.
cadence:
  # 'starter' while you warm up; switch to 'growth' or 'aggressive' when ready.
  active: starter
  profiles:
    starter:
      runs_per_day: 1
      drafts_per_run: 2
      platforms_per_draft: ["x", "linkedin", "facebook"]
    growth:
      runs_per_day: 2
      drafts_per_run: 2
      platforms_per_draft: ["x", "linkedin", "facebook"]
    aggressive:
      runs_per_day: 3
      drafts_per_run: 2
      platforms_per_draft: ["x", "linkedin", "facebook"]
  # Reddit is drafted separately, at most this often (days between reddit drafts).
  reddit_every_days: 3
  # Local-hour window (24h) to send drafts for approval, so you're not pinged at 3am.
  quiet_hours_start: 22
  quiet_hours_end: 8
  timezone: "Europe/Amsterdam"

# Build-in-public: turn your real git commits into 'build log' posts (/buildlog in the bot).
buildlog:
  enabled: true
  repo_path: ".."           # relative to growth-engine/ — points at the git repo root
  max_commits: 25           # how many recent commits to consider on the first run

model:
  id: "claude-opus-4-8"
  effort: "medium"          # low | medium | high — medium is a good balance for short posts
