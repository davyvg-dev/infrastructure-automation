# The single knob-board for the FITNESS vertical. Edit this, not the code.
# Run the engine against it with: GROWTH_CONFIG=config/fitness.yaml

vertical: fitness

brand:
  name: "Klantkraan"                 # the business; posts go out from the founder's accounts
  website: "klantkraan.nl"
  # The fitness social handle / positioning name is an OPEN founder decision — copy must
  # not invent one; the company stays Klantkraan for now.
  offer: "AI-ledenassistent voor sportclubs — an assistant that instantly answers every
    member and prospect message 24/7, qualifies the lead, and books the proefles into
    the calendar."
  one_liner: "Je sportschool krijgt een AI die elk bericht direct beantwoordt, 24/7, en de
    proefles meteen inplant — zodat je geen nieuwe leden meer verliest aan onbeantwoorde
    berichten."
  audience: "Owners of Dutch gyms, sportscholen, and boutique studios — crossfit, yoga,
    vechtsport, tennis. They lose trial-lesson leads to unanswered messages: evenings and
    weekends are peak interest time, exactly when the desk is unstaffed or busy. Their #1
    metric is new members, and that funnel starts with a proefles. They are ondernemers,
    not tech people."
  # 'build-in-public': you have no past client work yet, so content is shipped live.
  proof_mode: "build_in_public"

voice:
  # How the drafts should sound. Keep it concrete and human.
  tone: "Direct, concrete, a little opinionated. Energetic but no fitness-bro hype.
    Owner-to-owner honesty. No hype, no emoji spam, no 'in today's fast-paced world'
    filler. Short sentences."
  avoid: "Corporate buzzwords, engagement-bait questions with no substance, hashtag walls,
    fake urgency, 'game-changer', 'unlock', 'in this thread I'll', geen fitness-clichés
    ('zomerbody', 'beast mode')."

languages:
  primary: "Dutch"        # the buyer's language — customer-facing posts are Dutch
  secondary: "English"    # allowed for build-log posts aimed at the builder crowd

# Content pillars, weighted toward the BUYER (a gym owner), not other builders. The
# mix is ~40% proof, 30% problem, 20% teardown/hot-take, 10% build log — proof + problem
# convert; a dev-facing build/teardown/hot-take rotation grows the wrong audience.
pillars:
  - key: proof_demo
    weight: 4
    brief: "Show the ledenassistent actually working — a proefles booked at 22:00, an
      abonnement question answered instantly, a lead qualified while the desk was closed.
      Lead with the concrete result. Written to pair with a screenshot or short reel the
      user attaches."
  - key: problem
    weight: 3
    brief: "Speak to the owner's pain in money terms. A gym that misses evening/weekend
      DMs loses X proefles-leads a month — and each proefles-lead is worth a yearly
      membership (LTV), not one visit. Quantify it, or show a sharp before/after. End with
      a light, non-pushy takeaway. This is the highest-converting angle: educate the
      problem, don't hard-sell."
  - key: teardown
    weight: 2
    brief: "Tear down a bad lead experience gyms create — a DM answered two days later, a
      dead contact form, a proefles request that goes nowhere — and show how it should
      work. OR plainly explain how an AI ledenassistent actually works. Buyer-relevant,
      never developer bait."
  - key: hot_take
    weight: 2
    brief: "A sharp, industry-facing opinion aimed at gym owners (e.g. 'je front desk
      sluit om 22:00, je leads niet', 'a lead who messages three gyms joins the one that
      answers first'). Defensible and useful, not an AI/tech debate."
  - key: build_log
    weight: 1
    brief: "An honest behind-the-scenes note on building the ledenassistent — a decision,
      a bug, a small win — but tie it back to the gym-owner benefit so it lands with
      buyers, not just other builders."

# The platform registry (read by src/platforms.py) — everything per-platform lives HERE.
# Fitness buyers live on Instagram/Facebook/TikTok; the trades B2B channels are off here.
# The engine drafts native variants for each — never the same string on both.
# Per platform: enabled, delivery (auto|assisted), label (shown in Telegram), char_limit
# (optional), media (none|image|video|both), media_required, writing (drafting guidance).
platforms:
  x:
    enabled: false          # trades channel — off for fitness
    delivery: auto          # auto-post via API on approval
    label: "𝕏 (auto-post)"
    char_limit: 280
    media: none
    media_required: false
    note: "Distribution/personality. Links OK in-body. Punchier than LinkedIn."
    writing: "X post: max 280 characters, punchy, personality-forward, no hashtags unless
      natural. A strong first line that stands alone."
  linkedin:
    enabled: false          # trades channel — off for fitness
    delivery: assisted      # formatted + pushed to you to paste (native posts perform best)
    label: "in LinkedIn (paste)"
    media: none
    media_required: false
    note: "Primary B2B channel. No links in the post body (put them in comment 1 / Featured)."
    writing: "LinkedIn post (primary B2B channel): 150-400 words. The first 1-3 lines are
      a scroll-stopping hook that stands alone above the fold. Generous line breaks (1-2
      sentences each), one idea, end with a genuine question to spark comments. NO links
      in the body. No hashtag walls."
  reddit:
    enabled: false          # trades channel — off for fitness
    delivery: assisted
    label: "🔶 Reddit (paste)"
    media: none
    media_required: false
    note: "Value-first only. 1-2 high-effort posts/week, posted manually."
    writing: "Reddit: value-first, zero self-promotion in the body. Written to genuinely
      help in a relevant subreddit (e.g. r/smallbusiness, r/Klussers, r/ondernemers).
      Sound like a helpful practitioner, not an ad."
  # Meta/TikTok ToS forbid auto-posting — these three are assisted-only, permanently.
  facebook:
    enabled: true
    delivery: assisted
    label: "📘 Facebook (paste)"
    media: image
    media_required: false
    note: "Local-business reach (gym owners and their members are on FB). Image cards lift
      it, text works."
    writing: "Facebook post: conversational local-business tone, 50-150 words. Open with
      the gym owner's pain in plain words, close with one clear next step. No hashtag
      walls, at most one link."
  instagram:
    enabled: true
    delivery: assisted
    label: "📸 Instagram (paste)"
    media: both
    media_required: true
    note: "Fitness-vertical home turf. Needs an image or reel — caption alone can't post."
    writing: "Instagram caption: the first line is the hook (shown before 'more'). Short
      lines, concrete benefit, end with a simple CTA. 3-5 relevant hashtags at the end
      (niche fitness/local, e.g. sportschool + city, not generic #fitness), no more."
  tiktok:
    enabled: true
    delivery: assisted
    label: "🎵 TikTok (paste)"
    media: video
    media_required: true
    note: "Reels-only channel for the fitness vertical. The caption rides along the video."
    writing: "TikTok caption: one punchy line that frames the video's payoff, under 150
      characters, plus 2-3 niche fitness/local hashtags. No sales speak."

# Generated media: each draft gets an image card (square + story) rendered from its
# sharpest claim, previewed in Telegram. Neutral dark scheme until the fitness
# handle/branding is decided (open founder decision) — then update colors + footer here.
media:
  cards: true
  brand:
    bg: "#1A1A1A"        # neutral ink — no vertical branding yet
    text: "#FAF6EE"
    accent: "#3F7F4A"    # leaf — fits the health/fitness register
    muted: "#8C8474"
    footer: ""           # empty until the fitness handle exists
    font_bold: "assets/fonts/Inter-Bold.ttf"
    font_regular: "assets/fonts/Inter-Regular.ttf"
    # Rotated per draft (deterministic) so the feed isn't one repeated template.
    schemes:
      - { bg: "#1A1A1A", text: "#FAF6EE", muted: "#8C8474" }   # ink
      - { bg: "#3F7F4A", text: "#FAF6EE", muted: "#CFE3D4" }   # leaf
      - { bg: "#FAF6EE", text: "#1A1A1A", muted: "#8C8474" }   # cream
  # Every Nth card becomes a stock photo (Pexels, dark scrim + text) when the draft has
  # a photo_query and PEXELS_API_KEY is set. Pexels: free commercial use, no attribution.
  stock:
    enabled: true
    every: 3

# Cadence: how many generation runs per day and how many drafts each run makes.
# Start conservative; raise once you trust the quality.
# NOTE: the engine drafts ORIGINAL posts only. The real growth lever — replies/comments
# and DMs — must stay HUMAN; automating them kills reach and trust. See docs/STRATEGY.md.
cadence:
  # 'starter' while you warm up; switch to 'growth' or 'aggressive' when ready.
  active: starter
  profiles:
    starter:
      runs_per_day: 1
      drafts_per_run: 2
      platforms_per_draft: ["instagram", "facebook", "tiktok"]
    growth:
      runs_per_day: 2
      drafts_per_run: 2
      platforms_per_draft: ["instagram", "facebook", "tiktok"]
    aggressive:
      runs_per_day: 3
      drafts_per_run: 2
      platforms_per_draft: ["instagram", "facebook", "tiktok"]
  # Local-hour window (24h) to send drafts for approval, so you're not pinged at 3am.
  quiet_hours_start: 22
  quiet_hours_end: 8
  timezone: "Europe/Amsterdam"

# Build-in-public: turn your real git commits into 'build log' posts (/buildlog in the bot).
buildlog:
  enabled: true
  repo_path: ".."           # relative to growth-engine/ — points at the git repo root
  max_commits: 25           # how many recent commits to consider on the first run

model:
  id: "claude-opus-4-8"
  effort: "medium"          # low | medium | high — medium is a good balance for short posts
