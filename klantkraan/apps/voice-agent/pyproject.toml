[project]
name = "kk-voice-agent"
version = "0.0.1"
description = "Self-hosted Dutch AI receptionist on LiveKit Agents. Replaces Synthflow; owns the stack."
requires-python = ">=3.10,<3.15"
dependencies = [
    "livekit-agents~=1.4",
    "livekit-plugins-anthropic~=1.4",
    "livekit-plugins-deepgram~=1.4",
    "livekit-plugins-elevenlabs~=1.4",
    "livekit-plugins-silero~=1.4",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
