  <text x="96" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#FAF6EE">Nooit meer een klus</text><text x="96" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#FAF6EE">mislopen door een</text><text x="96" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#C75A2B">gemiste oproep.</text>
